name: Fundamentals cache

# 평일 장 마감 후(한국 시간 16:05) 종목 목록 161개의 재무 지표를 미리 계산해 Supabase 에 저장한다.
# 웹(Vercel)은 이 저장값을 먼저 읽으므로, 서버에서 야후가 막히거나 느려도 종목 조회가 된다.
# Judge top volume stocks(16:15) 보다 먼저 돌아야 판단이 이 저장값을 쓴다.
# 시크릿이 없으면 안내만 남기고 성공으로 끝난다. 예약 실행은 기본 브랜치의 워크플로만 돈다.
on:
  schedule:
    - cron: "5 7 * * 1-5"   # UTC 07:05 = KST 16:05
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundamentals-cache
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Cache fundamentals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run fundamentals:cache
