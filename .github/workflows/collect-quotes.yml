name: Collect quotes

# 장중(한국 시간 평일 09:00~15:55)에 5분마다 시세를 받아 Supabase 에 올린다.
# 시크릿 SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY 가 없으면 올리지 않고 요약만 남긴 채 성공으로 끝난다.
# 주의: 예약 실행(schedule)은 저장소의 '기본 브랜치'에 있는 워크플로만 돈다.
on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"   # UTC 00:00~06:55 = KST 09:00~15:55
  workflow_dispatch:

permissions:
  contents: read

# 앞 실행이 길어져도 겹쳐 돌지 않게 한다.
concurrency:
  group: collect-quotes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/collector/requirements.txt
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Collect and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/collect_quotes.py --upload
