name: Sector debates

# 장 마감 후(한국 시간 평일 16:40) 산업별 시장 토론을 만들어 Supabase 에 저장한다.
# 투자자들이 산업 뉴스와 오늘 거래 현황을 보고 의견을 낸 뒤(1라운드) 서로 반박·수정하고(2라운드) 사회자가 요약한다.
# Judge top volume stocks(16:15) 다음에 돌며, 같은 날 이미 만든 산업은 건너뛴다.
# 시크릿이 없으면 안내만 남기고 성공으로 끝난다.
# 주의: 예약 실행(schedule)은 저장소의 '기본 브랜치'에 있는 워크플로만 돈다.
on:
  schedule:
    - cron: "40 7 * * 1-5"   # UTC 07:40 = KST 16:40
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debate-sectors
  cancel-in-progress: false

jobs:
  debate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Run sector debates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          AI_DAILY_CAP: ${{ vars.AI_DAILY_CAP }}
        run: npm run debate:sectors
